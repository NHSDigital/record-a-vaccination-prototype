<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-two-thirds">

        <h1 class="nhsuk-heading-l">{{ pageName }}</h1>

        <p>Are you sure you want to resubmit?</p>

        <p>Make sure you have registered on MYS for the right vaccination services before you resubmit.</p>

        <div class="nhsuk-button-group">

            {{ button({
            "text": "Resubmit " + claimCount + " records",
            "href": nextPage
            }) }}

            <a href="{{ previousPage }}" class="nhsuk-link">Cancel</a>

        </div>

    </div>
</div>
